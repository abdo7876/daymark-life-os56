<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DAYMARK</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--sb:#FFFFFF;--tx:#111827;--t2:#6B7280;--ol:#647B55;--old:#4D6040;--olb:#EEF2E8;--tc:#C8755A;--tcd:#A4553B;--tcb:#FBEFEB;--cd:#FFFFFF;--bd:#E5E7EB;--mg:#F3F4F6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;margin:0}h1{font-size:30px}h3{margin:0 0 10px;font-size:14px}
aside{position:fixed;inset:0 auto 0 0;width:216px;padding:22px 12px;border-right:1px solid var(--bd);background:var(--sb);display:flex;flex-direction:column;gap:2px}
.logo{font:24px 'DM Serif Display',serif;padding:0 10px 16px}
aside button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--t2);font-weight:500}
aside button:hover{background:var(--mg)}aside button.on{background:var(--olb);color:var(--old)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ol);outline-offset:1px}
main{margin-left:216px;padding:28px;max-width:1080px}
.hd{margin-bottom:18px}.hd small,small{color:var(--t2)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.g2>.card{margin:0}
.big{font:34px 'DM Serif Display',serif;line-height:1.1}
.bar{height:6px;background:var(--mg);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ol)}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--t2);gap:3px;flex:1 1 130px}
input,select,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;background:#fff;min-width:0;width:100%}textarea{height:36px;resize:vertical}
form>input{flex:1 1 200px;width:auto}
.btn{background:var(--ol);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn2{background:var(--mg);color:var(--tx);border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.btn.tc{background:var(--tcd)}input[type=checkbox]{accent-color:var(--ol)}
.lk{all:unset;cursor:pointer;color:var(--t2);font-size:12px;padding:2px 6px}.lk:hover{color:var(--tcd)}
ul{list-style:none;margin:0;padding:0}.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd)}.row input[type=checkbox]{width:auto;margin-top:3px}
.g{flex:1;min-width:0;overflow-wrap:anywhere}.dn .g{opacity:.5;text-decoration:line-through}
.tag{background:var(--olb);color:var(--old);border-radius:6px;padding:1px 7px;font-size:11px;margin:0 4px}.tag.h{background:var(--tcb);color:var(--tcd)}
.empty{color:var(--t2);background:var(--mg);border-radius:8px;padding:14px;text-align:center;margin:6px 0 0}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ev{border-left:3px solid;background:var(--mg);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12px}
#toast{position:fixed;bottom:76px;right:16px;background:var(--tx);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#toast.s{opacity:1}
@media(max-width:800px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;overflow-x:auto;padding:6px;border:0;border-top:1px solid var(--bd);z-index:5;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}.logo{display:none}aside button{white-space:nowrap;font-size:12px}main{margin:0;padding:16px 14px 90px}h1{font-size:26px}}
</style></head><body><aside id="nav" aria-label="Main"></aside><main id="m"></main><div id="toast" role="status"></div>
<script>
const K='daymark.v1',D=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'],CATS=['University','TOEFL','Workout','Personal Care','Career','Personal'],
CC={University:'#647B55',TOEFL:'#C8755A',Workout:'#111827','Personal Care':'#6B7280',Career:'#8FA37E',Personal:'#9CA3AF'},
PG={overview:'Overview',today:'Today',week:'Weekly Planner',uni:'University',toefl:'TOEFL',fit:'Fitness & Nutrition',hab:'Habits & Sleep',career:'Career & Money',set:'Settings'};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),ld=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
dd=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5),pc=(a,b)=>b?Math.round(a/b*100):0,
mk=a=>a.map(x=>({id:uid(),...x})),sm=s=>s?`<br><small>${esc(s)}</small>`:'',bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`,
cd=d=>{const n=dd(d,ld());return n<0?-n+'d overdue':n==0?'Today':n==1?'Tomorrow':n+' days'},hm=t=>{const[a,b]=String(t).split(':');return a*60+ +b},
F=(n,l,t='text',o,req,d)=>({n,l,t,o,req,d});
function defs(){const ev=(day,start,end,title,cat)=>({day,start,end,title,cat});
return{s:{name:'',wake:'07:00',bed:'23:30',exam:'',target:75,base:'',tw:'',fd:'Saturday',wd:'Tuesday, Thursday, Friday',kcal:'',prot:'',step:'',quizDate:'2026-10-18'},hl:{},c:{tasks:[],
events:mk([ev('Saturday','11:30','18:00','University (leave 11:30, home ~6 PM)','University'),ev('Sunday','07:00','15:00','University (leave 7:00, home ~3 PM)','University'),ev('Monday','10:00','17:00','University (leave 10:00, home ~5 PM)','University'),
ev('Saturday','19:00','20:00','Quiz study: one lecture','University'),ev('Sunday','17:00','18:00','Quiz study: one lecture','University'),ev('Monday','18:30','19:30','TOEFL: listening + vocab','TOEFL'),
ev('Tuesday','09:30','11:30','TOEFL: reading + writing','TOEFL'),ev('Tuesday','12:00','13:00','Lunch & break','Personal'),ev('Tuesday','16:30','18:00','Workout','Workout'),
ev('Wednesday','10:00','12:00','Focused study / assignments','University'),ev('Wednesday','15:00','16:00','Career: portfolio or CV','Career'),ev('Thursday','09:30','11:30','TOEFL: speaking + listening','TOEFL'),
ev('Thursday','16:30','18:00','Workout','Workout'),ev('Friday','10:00','11:30','TOEFL: full section practice','TOEFL'),ev('Friday','16:30','18:00','Workout','Workout')]),
lec:mk([1,2,3,4].map(n=>({title:'Lecture '+n,status:'Not Started',notes:''}))),
chk:mk(['Collect the four lecture PDFs','Add lecture titles','Read through each lecture once','Write short summaries','Practice questions / past quiz','Final review the day before'].map(title=>({title,done:false}))),
asg:[],subj:mk([{name:'Software Engineering',code:''}]),ts:[],vocab:[],
plan:mk(Array.from({length:30},(_,i)=>({title:`Day ${i+1}: ${['Reading','Listening','Speaking','Writing','Vocabulary + mistake review'][i%5]}, 45-60 min`,done:false}))),
work:[],wt:[],meal:[],groc:mk(['Eggs','Beans / fava beans','Rice','Pasta','Potatoes','Lentils','Bread','Yogurt or milk','Seasonal fruit'].map(title=>({title,done:false}))),
habits:mk(['Brush teeth in the morning','Brush teeth before sleeping','Hair-care routine','Study for university','Practice TOEFL','Eat regular meals','Drink enough water','Sleep at a consistent time'].map(name=>({name,freq:'Daily'}))),sleep:[],career:[],money:[]}}}
let S,P='overview',CONF='',ED={},TF={cat:'All',st:'All',sort:'time',date:ld()};
const ok=r=>r&&typeof r.s=='object'&&r.c&&typeof r.c=='object'&&Array.isArray(r.c.tasks);
function norm(r){const d=defs(),o={...d,...r,s:{...d.s,...r.s},c:{...d.c,...r.c}};for(const k in d.c)if(!Array.isArray(o.c[k]))o.c[k]=d.c[k];for(const k in d.c)o.c[k]=o.c[k].filter(x=>x&&typeof x=='object').map(x=>({...x,id:String(x.id||'').replace(/[^a-z0-9]/gi,'')||uid()}));if(typeof o.hl!='object'||!o.hl)o.hl={};return o}
try{const r=JSON.parse(localStorage.getItem(K));S=ok(r)?norm(r):defs()}catch(e){S=defs()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save: browser storage unavailable')}const j=$('jx');if(j)j.value=JSON.stringify(S)},toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1800)};
const head=(t,s='')=>`<header class=hd><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small><h1>${t}</h1>${s?`<small>${s}</small>`:''}</header>`;
const isDn=(k,i)=>k=='lec'?i.status=='Studied':k=='asg'?i.status=='Completed':k=='career'?i.status=='Done':i.done;
function sec(k,title,fl,row,o={}){const e=ED[k],L=o.items?o.items(S.c[k]):S.c[k];
const inp=f=>{const v=e?e[f.n]:(f.d??''),a=`name=${f.n} ${f.req?'required':''}`;return `<label class=f>${f.l}${f.t=='select'?`<select ${a}>${f.o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea ${a}>${esc(v)}</textarea>`:`<input type=${f.t} ${a} value="${esc(v)}" ${f.t=='number'?'step=any':''}>`}</label>`};
return `<section class=card><h3>${title}</h3><form data-f=${k} class=fm>${fl.map(inp).join('')}<button class=btn>${e?'Save':'Add'}</button>${e?`<button type=button class=btn2 data-a=cx data-k=${k}>Cancel</button>`:''}</form>${o.nolist?'':`<ul>${L.length?L.map(i=>{const dn=isDn(k,i);return `<li class="row${dn?' dn':''}">${o.done?`<input type=checkbox aria-label=Done data-a=tog data-k=${k} data-i=${i.id} ${dn?'checked':''}>`:''}<div class=g>${row(i)}</div><button class=lk data-a=edit data-k=${k} data-i=${i.id}>Edit</button><button class=lk data-a=del data-k=${k} data-i=${i.id}>${CONF==k+i.id?'Confirm?':'Delete'}</button></li>`}).join(''):`<p class=empty>${o.empty||'Nothing here yet.'}</p>`}</ul>`}</section>`}
const lst=(k,t,fl,row,o)=>sec(k,t,fl,row,o);
const sorted=(L,f)=>[...L].sort((a,b)=>a[f]<b[f]?-1:1);
const PG_={
overview(){const t=S.c.tasks.filter(x=>x.date==ld()),dn=t.filter(x=>x.done).length,H=S.c.habits,hd=H.filter(h=>(S.hl[h.id]||{})[ld()]).length,
dl=[...(S.c.lec.every(l=>l.status=='Studied')&&S.s.quizDate<ld()?[]:[{t:'Software Quiz',d:S.s.quizDate}]),...S.c.asg.filter(a=>a.status!='Completed'&&a.due).map(a=>({t:a.title,d:a.due}))].filter(x=>x.d).sort((a,b)=>a.d<b.d?-1:1).slice(0,5),
ls=S.c.lec.filter(x=>x.status=='Studied').length,wk=ld(new Date(Date.now()-6*864e5)),tm=S.c.ts.filter(x=>x.date>=wk).reduce((a,x)=>a+(+x.mins||0),0),
wo=new Set(S.c.work.filter(x=>x.date>=wk).map(x=>x.date)).size,wn=String(S.s.wd).split(',').filter(x=>x.trim()).length||3,h=new Date().getHours();
return head(`${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${S.s.name?', '+esc(S.s.name):''}`)+`<div class=g2>
<div class=card><h3>Today's plan</h3><div class=big>${pc(dn,t.length)}%</div>${bar(pc(dn,t.length))}<small>${dn} of ${t.length} tasks done</small><ul>${t.filter(x=>!x.done).slice(0,4).map(x=>`<li class=row><div class=g>${esc(x.title)} <small>${x.time||''}</small></div></li>`).join('')||'<p class=empty>No open tasks today.</p>'}</ul></div>
<div class=card><h3>Upcoming deadlines</h3><ul>${dl.map(x=>`<li class=row><div class=g>${esc(x.t)}</div><b style="color:var(--tcd)">${cd(x.d)}</b></li>`).join('')||'<p class=empty>No deadlines.</p>'}</ul></div>
<div class=card><h3>University</h3><div class=big>${ls}/${S.c.lec.length}</div>${bar(pc(ls,S.c.lec.length))}<small>quiz lectures studied</small></div>
<div class=card><h3>TOEFL</h3><div class=big>${S.s.base||'?'} → ${S.s.target}</div><small>${tm} min logged in the last 7 days${S.s.exam?' · exam in '+cd(S.s.exam):' · set your exam date in Settings'}</small></div>
<div class=card><h3>Workouts this week</h3><div class=big>${wo}/${wn}</div>${bar(Math.min(100,pc(wo,wn)))}<small>from logged sessions</small></div>
<div class=card><h3>Habits today</h3><div class=big>${pc(hd,H.length)}%</div>${bar(pc(hd,H.length))}<small>${hd} of ${H.length}</small></div></div>`},
today(){const f=TF,T=S.c.tasks.filter(x=>x.date==f.date),dn=T.filter(x=>x.done).length,sel=(k,o)=>`<select data-t=${k} aria-label=${k}>${o.map(x=>`<option ${x==f[k]?'selected':''}>${x}</option>`).join('')}</select>`,pr={High:0,Medium:1,Low:2};
return head('Today')+`<div class=card><form data-q class=fm><input name=title placeholder="Quick add a task for ${f.date}…" required aria-label="Quick add"><button class=btn>Add</button></form>
<div class=fm><label class=f>Date<input type=date data-t=date value=${f.date}></label><label class=f>Category${sel('cat',['All',...CATS])}</label><label class=f>Status${sel('st',['All','Open','Done'])}</label><label class=f>Sort${sel('sort',['time','priority'])}</label></div>${bar(pc(dn,T.length))}<small>${pc(dn,T.length)}% complete · ${dn}/${T.length}</small></div>`+
sec('tasks','Add / edit task',[F('title','Title','text',0,1),F('desc','Description'),F('cat','Category','select',CATS),F('pri','Priority','select',['Low','Medium','High'],0,'Medium'),F('time','Time','time'),F('dur','Minutes','number'),F('date','Date','date',0,1,f.date)],
i=>`<b>${esc(i.title)}</b><span class=tag>${i.cat}</span><span class="tag ${i.pri=='High'?'h':''}">${i.pri}</span><small>${i.time||''} ${i.dur?i.dur+' min':''}</small>${sm(i.desc)}`,
{done:1,empty:'No tasks match. Add one above.',items:L=>L.filter(x=>x.date==f.date&&(f.cat=='All'||x.cat==f.cat)&&(f.st=='All'||(f.st=='Done')==!!x.done)).sort((a,b)=>f.sort=='time'?(a.time||'99')<(b.time||'99')?-1:1:pr[a.pri]-pr[b.pri])})},
week(){const o=Math.max(0,D.indexOf(S.s.fd)),DS=[...D.slice(o),...D.slice(0,o)],td=new Date().toLocaleDateString('en-US',{weekday:'long'});
return head('Weekly Planner','Weekly recurring timetable. Edit any block below.')+`<div class=wk>${DS.map(d=>{let pe='';const L=sorted(S.c.events.filter(e=>e.day==d),'start');return `<div class=card style="margin:0${d==td?';border-color:var(--ol)':''}"><h3>${d}${d==td?' · today':''}</h3>${L.map(e=>{const ov=e.start<pe;pe=e.end;return `<div class=ev style="border-color:${CC[e.cat]}"><b>${e.start}–${e.end}</b> ${esc(e.title)}${ov?' <span class="tag h">overlap</span>':''}<br><button class=lk data-a=edit data-k=events data-i=${e.id}>Edit</button><button class=lk data-a=del data-k=events data-i=${e.id}>${CONF=='events'+e.id?'Confirm?':'Delete'}</button></div>`}).join('')||'<p class=empty>Free day</p>'}</div>`}).join('')}</div><br>`+
sec('events','Add / edit block',[F('title','Title','text',0,1),F('day','Day','select',D),F('start','Start','time',0,1,'09:00'),F('end','End','time',0,1,'10:00'),F('cat','Category','select',CATS)],()=>'',{nolist:1})},
uni(){const n=dd(S.s.quizDate,ld()),ls=S.c.lec.filter(x=>x.status=='Studied').length,ck=S.c.chk.filter(x=>x.done).length,prog=pc(ls+ck,S.c.lec.length+S.c.chk.length);
const bl=[...S.c.asg.filter(a=>a.status!='Completed'&&a.due&&a.due<ld()).map(a=>`${esc(a.title)} (${cd(a.due)})`),...(n<0?S.c.lec.filter(l=>l.status!='Studied').map(l=>esc(l.title)+' (quiz passed)'):[])];
return head('University')+`<div class=g2><div class=card><h3>Software Quiz</h3><div class=big style="color:var(--tc)">${S.s.quizDate?(n<0?-n+'d ago':n==0?'Today':n+' days'):'—'}</div><small>${S.s.quizDate?new Date(S.s.quizDate+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):''} · ${S.c.lec.length} lectures · High priority · ${ls&&ls==S.c.lec.length?'Completed':'In Progress'}</small>${bar(prog)}<small>${prog}% prepared</small><label class=f>Quiz date<input type=date data-s=quizDate data-r=1 value="${S.s.quizDate}"></label></div>
<div class=card><h3>Study Backlog</h3><ul>${bl.map(x=>`<li class=row>${x}</li>`).join('')||'<p class=empty>Nothing overdue.</p>'}</ul></div></div><br>`+
sec('lec','Quiz lectures (tick = studied)',[F('title','Title','text',0,1),F('status','Status','select',['Not Started','In Progress','Studied']),F('notes','Notes')],i=>`<b>${esc(i.title)}</b><span class=tag>${i.status}</span>${sm(i.notes)}`,{done:1})+
sec('chk','Preparation checklist',[F('title','Item','text',0,1)],i=>esc(i.title),{done:1})+
sec('asg','Assignments, quizzes & exams',[F('title','Title','text',0,1),F('subject','Subject'),F('due','Due','date'),F('pri','Priority','select',['Low','Medium','High']),F('status','Status','select',['Not Started','In Progress','Completed']),F('notes','Notes')],i=>`<b>${esc(i.title)}</b> <small>${esc(i.subject)}</small><span class=tag>${i.status}</span><span class="tag ${i.pri=='High'?'h':''}">${i.pri}</span><small>${i.due?cd(i.due):''}</small>${sm(i.notes)}`,{done:1})+
sec('subj','Subjects',[F('name','Name','text',0,1),F('code','Course code')],i=>`<b>${esc(i.name)}</b> <small>${esc(i.code)}</small>`)},
toefl(){const sk=['Reading','Listening','Speaking','Writing'],mx=Math.max(1,...sk.map(s=>S.c.ts.filter(x=>x.skill==s).reduce((a,x)=>a+(+x.mins||0),0)));
return head('TOEFL',`Target ${S.s.target}/120 · baseline ${S.s.base||'not set'} · ${S.s.exam?'exam in '+cd(S.s.exam):'exam date not set'} (edit in Settings)`)+`<div class=g2>${sk.map(s=>{const L=S.c.ts.filter(x=>x.skill==s),m=L.reduce((a,x)=>a+(+x.mins||0),0),sc=L.filter(x=>x.score!=='').slice(-1)[0];return `<div class=card><h3>${s}</h3><b>${m} min</b> · ${L.length} sessions${sc?' · last score '+sc.score:''}${bar(Math.round(m/mx*100))}</div>`}).join('')}</div><br>`+
sec('ts','Log practice session',[F('date','Date','date',0,1,ld()),F('skill','Skill','select',[...sk,'Full test']),F('mins','Minutes','number',0,1),F('score','Score'),F('mistakes','Mistakes'),F('next','Improve next'),F('self','Self-rating 1-5','number')],i=>`<b>${i.skill}</b> · ${i.date} · ${i.mins} min${i.score?' · score '+esc(i.score):''}${i.self?' · self '+esc(i.self)+'/5':''}${sm(i.mistakes)}${i.next?'<small>→ '+esc(i.next)+'</small>':''}`,{empty:'No sessions logged yet.',items:L=>[...L].reverse()})+
sec('vocab','Vocabulary',[F('word','Word','text',0,1),F('meaning','Meaning / example')],i=>`<b>${esc(i.word)}</b> ${esc(i.meaning)}`)+
sec('plan','30-day plan (editable template)',[F('title','Day / focus','text',0,1)],i=>esc(i.title),{done:1})},
fit(){const W=sorted(S.c.wt,'date'),tw=+S.s.tw,td=ld(),M=S.c.meal.filter(m=>m.date==td),kc=M.reduce((a,m)=>a+(+m.kcal||0),0),pr=M.reduce((a,m)=>a+(+m.prot||0),0);
let ch='<p class=empty>Log at least two weights to see a chart.</p>';if(W.length>1){const v=W.map(x=>+x.kg),lo=Math.min(...v,50)-1,hi=Math.max(...v,tw||0)+1,p=W.map((x,i)=>`${10+i*(280/(W.length-1))},${100-(x.kg-lo)/(hi-lo)*90}`).join(' ');ch=`<svg viewBox="0 0 300 110" width=100% role=img aria-label="Weight history"><polyline fill=none stroke="#647B55" stroke-width=2 points="${p}"/><text x=4 y=10 font-size=9 fill="#6B7280">${hi.toFixed(0)} kg</text><text x=4 y=108 font-size=9 fill="#6B7280">${lo.toFixed(0)} kg</text></svg>`}

<div class=card><h3>Today's food</h3><div class=big>${kc} kcal</div>${S.s.kcal?bar(Math.min(100,pc(kc,S.s.kcal)))+`<small>of ${S.s.kcal} target</small>`:'<small>Set a calorie target in Settings</small>'}<br><small>Protein ${pr} g${S.s.prot?' of '+S.s.prot:''}</small></div></div><br>`+

return head('Habits & Sleep','Consistency over perfection. A missed day is just a day.')+`<div class=card><h3>Today · ${pc(hd,H.length)}% (${hd}/${H.length})</h3>${bar(pc(hd,H.length))}<ul>${H.map(h=>`<li class=row><input type=checkbox aria-label="${esc(h.name)}" data-a=hab data-i=${h.id} ${(S.hl[h.id]||{})[td]?'checked':''}><div class=g>${esc(h.name)} <small>${h.freq}</small></div><span title="last 7 days">${dy.map(d=>(S.hl[h.id]||{})[d]?'●':'○').join('')}</span>${stk(h)>1?`<span class=tag>${stk(h)} day run</span>`:''}<button class=lk data-a=del data-k=habits data-i=${h.id}>${CONF=='habits'+h.id?'Confirm?':'Remove'}</button></li>`).join('')||'<p class=empty>No habits yet.</p>'}</ul></div>`+

`<div class=card><h3>${mo} balance</h3><div class=big>${inc-ex} EGP</div><small>Income ${inc} · Expenses ${ex} · stored only in this browser</small></div>`+

function render(){nav.innerHTML='<div class=logo>DAYMARK</div>'+Object.entries(PG).map(([k,v])=>`<button data-a=nav data-p=${k} class="${k==P?'on':''}" ${k==P?'aria-current=page':''}>${v}</button>`).join('');m.innerHTML=PG_[P]()}
const nav=document.getElementById('nav'),m=document.getElementById('m');
document.addEventListener('submit',e=>{const t=e.target;if(t.dataset.q!==undefined){e.preventDefault();const ttl=t.elements.title.value.trim();if(!ttl)return toast('Enter a task title');S.c.tasks.push({id:uid(),title:ttl,desc:'',cat:'Personal',pri:'Medium',time:'',dur:'',date:TF.date,done:false});save();render();return toast('Task added')}
const k=t.dataset.f;if(!k)return;e.preventDefault();const o=Object.fromEntries(new FormData(t));for(const x in o)o[x]=String(o[x]).trim();if([...t.querySelectorAll('[required]')].some(x=>!String(x.value).trim()))return toast('Please fill the required fields');if(k=='events'&&o.end<=o.start)return toast('End time must be after start');const cur=ED[k]&&S.c[k].find(x=>x.id==ED[k].id);if(cur)Object.assign(cur,o);else S.c[k].push({id:uid(),done:false,...o});ED[k]=null;save();render();toast('Saved')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,i=b.dataset.i,it=k&&S.c[k]?S.c[k].find(x=>x.id==i):null;if(!['del','imp','rst'].includes(a))CONF='';
if(a=='nav'){P=b.dataset.p;CONF='';ED={};render();return scrollTo(0,0)}
if(a=='tog'){if(k=='lec')it.status=it.status=='Studied'?'Not Started':'Studied';else if(k=='asg')it.status=it.status=='Completed'?'Not Started':'Completed';else if(k=='career')it.status=it.status=='Done'?'In Progress':'Done';else it.done=!it.done}
else if(a=='del'){if(CONF==k+i){S.c[k]=S.c[k].filter(x=>x.id!=i);if(ED[k]&&ED[k].id==i)ED[k]=null;CONF='';toast('Deleted')}else{CONF=k+i;render();return}}
else if(a=='edit'){ED[k]=it;render();const fm=document.querySelector('form[data-f='+k+']');if(fm){fm.scrollIntoView({block:'center'});const q=fm.querySelector('input,select');if(q)q.focus()}return}else if(a=='cx')ED[k]=null;
else if(a=='hab'){const l=S.hl[i]=S.hl[i]||{};l[ld()]=!l[ld()]}
else if(a=='copy'){try{const j=$('jx');j.select();navigator.clipboard.writeText(j.value).then(()=>toast('Copied'),()=>toast('Press Ctrl/Cmd+C'))}catch(x){toast('Press Ctrl/Cmd+C')}return}
else if(a=='imp'){if(CONF!='imp'){CONF='imp';b.textContent='Confirm replace all data';return}try{const r=JSON.parse($('ji').value);if(!ok(r))throw 0;S=norm(r);CONF='';save();toast('Backup imported')}catch(x){CONF='';b.textContent='Import';return toast('Invalid backup: use a file exported from DAYMARK')}}
else if(a=='rst'){if(CONF!='rst'){CONF='rst';b.textContent='Confirm: erase everything';return}S=defs();CONF='';ED={};save();toast('All data reset')}
save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.t){if(t.value)TF[t.dataset.t]=t.value;render()}else if(t.dataset.s){S.s[t.dataset.s]=t.value;save();if(t.dataset.r||t.dataset.s=='fd')render()}else if(t.id=='jf'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('ji').value=r.result};r.readAsText(t.files[0])}});
render();
